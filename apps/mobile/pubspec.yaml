name: yuz_mobile
description: Yuz — AI beauty camera and editor.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_ui: ^1.1.4
  flutter_riverpod: ^3.4.3
  gal: ^2.3.3
  go_router: ^18.1.1
  image_picker: ^1.2.4
  intl: ^0.20.2
  # Required by pro_image_editor, which is built on the decoupled Material library.
  material_ui: ^1.8.0
  path_provider: ^2.1.6
  # 13.x pulls permission_handler_android 14.x (compileSdk 37), unsupported by AGP 9.1.
  permission_handler: ^12.0.3
  pro_image_editor: 14.21.1
  shared_preferences: ^2.5.6
  yuz_beauty_engine:
    path: ../../packages/yuz_beauty_engine
  video_player: ^2.14.1

dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true
  generate: true
