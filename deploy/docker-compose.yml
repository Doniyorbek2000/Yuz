# Local / single-host stack. Copy deploy/.env.example to deploy/.env first
# (git-ignored) and fill every secret; nothing here has a usable default.
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build
name: yuz

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: yuz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: yuz
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yuz -d yuz']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD}']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  migrate:
    build: { context: ../apps/backend, target: migrate }
    environment:
      DATABASE_URL: postgresql://yuz:${POSTGRES_PASSWORD}@postgres:5432/yuz
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    build: { context: ../apps/backend, target: runtime }
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://yuz:${POSTGRES_PASSWORD}@postgres:5432/yuz
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN}
      STORAGE_DIR: /data/storage
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CLOUD_AI_CONSENT_VERSION: ${CLOUD_AI_CONSENT_VERSION:-2026-10}
      AI_ENABLED_TYPES: ${AI_ENABLED_TYPES:-BACKGROUND}
    volumes:
      - storage:/data/storage
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: { context: ../services/ai-worker }
    environment:
      API_URL: http://api:3000
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      WORKER_TOKEN: ${WORKER_TOKEN}
      STORAGE_DIR: /data/storage
      CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    volumes:
      - storage:/data/storage
    depends_on:
      api: { condition: service_healthy }
    # Running jobs finish (or are re-queued by BullMQ) before the container stops.
    stop_grace_period: 2m

  admin:
    build: { context: ../apps/admin }
    environment:
      API_URL: http://api:3000
    ports:
      # Operators only: keep it on loopback and reach it through a VPN or SSH tunnel.
      - '127.0.0.1:3001:3001'
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  # Uploads and results, shared by the API and the worker.
  storage:
