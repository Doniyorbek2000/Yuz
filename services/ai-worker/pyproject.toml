[project]
name = "yuz-ai-worker"
version = "0.1.0"
description = "Processes Yuz cloud AI jobs from the BullMQ queue."
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = [
  "bullmq==3.3.4",
  "httpx==0.28.1",
  "mediapipe==1.1.1",
  "numpy==2.5.4",
  "pillow==12.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.0"]

[project.scripts]
yuz-ai-worker = "yuz_worker.main:run"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["yuz_worker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]
